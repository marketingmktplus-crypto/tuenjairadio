<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<base target="_top">

<style>

html,
body{
   margin:0;
   padding:0;
   width:100%;
   height:100%;
   overflow:hidden;
   background:#eef1f5;

   /* Android */
   touch-action: manipulation;

   /* iPhone */
   -webkit-text-size-adjust:100%;
}

/* ทำให้ iframe เต็มจอจริงทุกอุปกรณ์ */
iframe{
   position:fixed;
   top:0;
   left:0;

   width:100vw;
   height:100vh;

   border:0;

   display:block;
}

/* ป้องกัน zoom ตอนพิมพ์ */
input,
textarea,
select{
   font-size:16px !important;
}

</style>

</head>

<body>

<iframe
src="https://script.google.com/macros/s/AKfycbwagivtra8lXtt-SZ0ZSAjh0dfDWffesvFgFWIuLIbsS7sZO3dgqqUzE4yGHSufcHxHBA/exec">
</iframe>

</body>
</html>
